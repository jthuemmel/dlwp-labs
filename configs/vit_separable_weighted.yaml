# Lab 3, part 3: the separable model trained with a weight per variable in the loss (surface weights and pressure over 1000 hPa,
# after GraphCast); the validation loss and the scores stay unweighted.
dataset:
  path: data/era5_5p6.zarr
  stats_path: data/stats.zarr
  variables: [T2M, U10M, V10M, TP6h, Z500, T850, Q700, U250, V250]
  sequence_length: 2
  time_slice: {start: "2015", stop: "2018"}
  lat_slice: null
  lon_slice: null
  batch_size: 16
  num_workers: 0

network:
  name: vit
  dim: 16
  num_layers: 4
  num_heads: 4
  dim_heads: 32
  patch_size: [4, 4]
  expansion_factor: 2
  separable_embed: true

objective:
  name: weighted_mse
  kwargs:
    latitude_weighting: false
    variable_weights: {T2M: 1.0, U10M: 0.1, V10M: 0.1, TP6h: 0.1, Z500: 0.5, T850: 0.85, Q700: 0.7, U250: 0.25, V250: 0.25}

trainer:
  lr: 1.0e-3
  weight_decay: 0.01
  betas: [0.9, 0.95]
  max_steps: 2000
  rollout_steps: 4
  val_time_slice: {start: "2019", stop: "2019"}
  predict_steps: 20        # section 0: the roll-out of Trainer.predict, five days at six hours
  predict_stride: 5        # section 0: one initialisation every 30 hours, so 00, 06, 12, and 18 UTC in turn
  train_rollout_steps: 1    # part 2: autoregressive steps in the training step
  pre_steps: 0               # part 2: single-step training steps before the roll-out training begins
